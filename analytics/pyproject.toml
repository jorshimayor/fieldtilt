[project]
name = "bluebot-analytics"
version = "0.0.1"
description = "Football models (xG, forecasts, data quality) feeding the bluebot Worker via Neon"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "mplsoccer>=1.4",
  "scikit-learn>=1.4",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "jupyterlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluebot_analytics"]
