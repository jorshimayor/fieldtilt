name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: echo "on=$([ -n "$CF_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "20" }
      - if: steps.gate.outputs.on == 'true'
        run: npm i -g pnpm@9.11.0 && pnpm install --no-frozen-lockfile && pnpm build:worker
      - if: steps.gate.outputs.on == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy dist/worker.mjs
      - if: steps.gate.outputs.on == 'false'
        run: echo "CLOUDFLARE_API_TOKEN secret not set - skipping deploy (add it in repo Settings > Secrets)"
