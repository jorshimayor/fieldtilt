<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRIDGWAYS — Control Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,400;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="min-h-screen">
    <main class="max-w-6xl mx-auto p-6 space-y-8">
      <header class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="brand text-2xl">BRIDGWAYS.</h1>
          <p class="label mt-1">Chelsea FC · Control Room</p>
        </div>
        <div class="flex gap-2 items-center">
          <input
            id="adminKey"
            type="password"
            placeholder="Admin key (CRON_SECRET)"
            class="p-2 text-sm w-56"
          />
          <button id="refresh" class="btn px-4 py-2 text-sm">Refresh</button>
        </div>
      </header>

      <!-- Approval queue -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="display text-xl">APPROVAL QUEUE</h2>
          <div class="flex gap-2 text-xs">
            <button data-status="pending" class="qtab btn px-3 py-1.5">Pending</button>
            <button data-status="posted" class="qtab btn-ghost px-3 py-1.5">Posted</button>
            <button data-status="rejected" class="qtab btn-ghost px-3 py-1.5">Rejected</button>
          </div>
        </div>
        <div id="queue" class="space-y-4">
          <div class="muted text-sm">Enter your admin key, then Refresh.</div>
        </div>
      </section>

      <!-- Compose -->
      <section class="card rounded-xl p-5 space-y-4">
        <h2 class="display text-xl">COMPOSE</h2>
        <div class="grid md:grid-cols-4 gap-3 text-sm">
          <label>
            <span class="label">Kind</span>
            <select id="kind" class="w-full mt-1 p-2">
              <option value="match_preview">Match preview</option>
              <option value="live_update">Live update</option>
              <option value="post_match">Post-match</option>
              <option value="player_stat">Player stat</option>
              <option value="transfer_news">Transfer news</option>
              <option value="weekly_deep_dive">Weekly deep-dive</option>
              <option value="long_read">Long-form read</option>
            </select>
          </label>
          <label>
            <span class="label">Tone</span>
            <select id="tone" class="w-full mt-1 p-2">
              <option value="professional">Professional</option>
              <option value="savage">Savage</option>
            </select>
          </label>
          <label>
            <span class="label">Card (image)</span>
            <select id="cardKind" class="w-full mt-1 p-2">
              <option value="">No image</option>
              <option value="match_preview">Match preview</option>
              <option value="score">Score</option>
              <option value="post_match">Post-match</option>
              <option value="player_stat">Player stat</option>
              <option value="transfer">Transfer</option>
              <option value="form">Form</option>
              <option value="editorial">Editorial</option>
            </select>
          </label>
          <label class="flex items-end gap-2 pb-1">
            <input type="checkbox" id="longform" class="w-4 h-4" />
            <span class="dim">Long-form</span>
          </label>
        </div>
        <label class="block text-sm">
          <span class="label">Tweet data (JSON — grounds the LLM copy)</span>
          <textarea id="data" rows="3" class="w-full mt-1 p-2 font-mono text-xs">
{"opponent":"Arsenal","competition":"Premier League","date":"Sat 3 PM","venue":"Stamford Bridge"}</textarea>
        </label>
        <label class="block text-sm">
          <span class="label">Card data (JSON — leave empty to use demo data)</span>
          <textarea id="cardData" rows="2" class="w-full mt-1 p-2 font-mono text-xs"></textarea>
        </label>
        <button id="compose" class="btn px-4 py-2 text-sm">Generate → queue</button>
        <p id="composeMeta" class="muted text-xs"></p>
      </section>

      <!-- Health -->
      <section class="card rounded-xl p-5">
        <h2 class="display text-xl mb-3">READINESS</h2>
        <div id="health" class="flex flex-wrap gap-2 text-xs">
          <span class="muted">Loading…</span>
        </div>
        <ul id="healthHints" class="muted text-xs mt-3 list-disc ml-5 space-y-1"></ul>
      </section>

      <!-- Design studio -->
      <section class="card rounded-xl p-5 space-y-3">
        <h2 class="display text-xl">DESIGN STUDIO</h2>
        <p class="label">Card templates with demo data</p>
        <div class="flex flex-wrap gap-2" id="cardKinds">
          <button data-kind="match_preview" class="btn-ghost px-3 py-1.5 text-xs">Match preview</button>
          <button data-kind="score" class="btn-ghost px-3 py-1.5 text-xs">Live score</button>
          <button data-kind="post_match" class="btn-ghost px-3 py-1.5 text-xs">Post-match</button>
          <button data-kind="player_stat" class="btn-ghost px-3 py-1.5 text-xs">Player stat</button>
          <button data-kind="transfer" class="btn-ghost px-3 py-1.5 text-xs">Transfer</button>
          <button data-kind="form" class="btn-ghost px-3 py-1.5 text-xs">Weekly form</button>
          <button data-kind="editorial" class="btn-ghost px-3 py-1.5 text-xs">Editorial</button>
        </div>
        <div id="studioPreview" class="max-w-xl"></div>
      </section>

      <!-- Fixtures + recent -->
      <section class="grid md:grid-cols-2 gap-6">
        <div class="card rounded-xl p-5">
          <h2 class="display text-xl mb-3">FIXTURES</h2>
          <div id="fixtures" class="space-y-2 text-sm">
            <div class="muted">Loading…</div>
          </div>
        </div>
        <div class="card rounded-xl p-5">
          <h2 class="display text-xl mb-3">RECENTLY POSTED</h2>
          <ul id="posts" class="space-y-2 text-sm">
            <li class="muted">Loading…</li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      // ---------- auth ----------
      const keyInput = document.getElementById("adminKey");
      keyInput.value = localStorage.getItem("adminKey") || "";
      keyInput.addEventListener("change", () => localStorage.setItem("adminKey", keyInput.value.trim()));
      function authHeaders(extra) {
        const h = extra || {};
        const k = (keyInput.value || "").trim();
        if (k) h["Authorization"] = "Bearer " + k;
        return h;
      }

      function escapeHtml(s) {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return String(s ?? "").replace(/[&<>"']/g, (c) => map[c]);
      }

      // ---------- client-side rasterization (free-plan path) ----------
      // Fetch the card as SVG with fonts embedded, draw to canvas, get a PNG.
      async function fetchCardSvg(cardKind, cardData) {
        const res = await fetch("/api/render", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ kind: cardKind, data: cardData || undefined, format: "svg", fonts: true }),
        });
        if (!res.ok) throw new Error("render failed (" + res.status + ")");
        return res.text();
      }

      function svgSize(svgText) {
        const m = svgText.match(/viewBox="0 0 (\d+) (\d+)"/);
        return m ? { w: +m[1], h: +m[2] } : { w: 1200, h: 675 };
      }

      async function svgToPngBase64(svgText) {
        const { w, h } = svgSize(svgText);
        const blob = new Blob([svgText], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        try {
          const img = new Image();
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error("svg decode failed"));
            img.src = url;
          });
          // brief delay lets embedded @font-face data URIs finish loading
          await new Promise((r) => setTimeout(r, 250));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          return canvas.toDataURL("image/png");
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      // ---------- approval queue ----------
      let queueStatus = "pending";
      document.querySelectorAll(".qtab").forEach((b) =>
        b.addEventListener("click", () => {
          queueStatus = b.dataset.status;
          document.querySelectorAll(".qtab").forEach((x) => (x.className = x.className.replace("btn ", "btn-ghost ")));
          b.className = b.className.replace("btn-ghost ", "btn ");
          loadQueue();
        })
      );

      async function loadQueue() {
        const el = document.getElementById("queue");
        try {
          const res = await fetch("/api/drafts?status=" + queueStatus, { headers: authHeaders() });
          if (!res.ok) {
            el.innerHTML = '<div class="muted text-sm">Queue unavailable (' + res.status + ") — check the admin key.</div>";
            return;
          }
          const j = await res.json();
          const list = j.drafts || [];
          if (!list.length) {
            el.innerHTML = '<div class="muted text-sm">Nothing ' + queueStatus + ".</div>";
            return;
          }
          el.innerHTML = list.map(draftHtml).join("");
          list.forEach(wireDraft);
        } catch (e) {
          el.innerHTML = '<div class="muted text-sm">Queue error: ' + escapeHtml(e.message) + "</div>";
        }
      }

      function draftHtml(d) {
        const when = d.createdAt ? new Date(d.createdAt).toLocaleString() : "";
        const isPending = d.status === "pending";
        return (
          '<div class="card rounded-xl p-4 space-y-3" id="draft-' + d.id + '">' +
          '<div class="flex items-center justify-between flex-wrap gap-2">' +
          '<div class="flex gap-2 items-center">' +
          '<span class="chip px-2.5 py-1 text-xs">' + escapeHtml(d.kind) + "</span>" +
          (d.longform ? '<span class="chip px-2.5 py-1 text-xs">long-form</span>' : "") +
          (d.cardKind ? '<span class="chip px-2.5 py-1 text-xs">🖼 ' + escapeHtml(d.cardKind) + "</span>" : "") +
          '<span class="label">' + escapeHtml(d.source || "") + " · " + when + "</span>" +
          "</div>" +
          '<span class="label status-' + d.status + '">' + d.status + (d.tweetId ? " · " + escapeHtml(d.tweetId) : "") + "</span>" +
          "</div>" +
          '<div class="grid md:grid-cols-2 gap-4">' +
          '<textarea data-role="content" rows="6" class="w-full p-3 text-sm" ' + (isPending ? "" : "readonly") + ">" +
          escapeHtml(d.content) +
          "</textarea>" +
          '<div data-role="preview" class="min-h-[80px]">' +
          (d.cardKind ? '<div class="muted text-xs">Loading preview…</div>' : '<div class="muted text-xs">No image for this draft.</div>') +
          "</div></div>" +
          (isPending
            ? '<div class="flex gap-2">' +
              '<button data-role="post" class="btn px-4 py-2 text-sm">Post to X</button>' +
              '<button data-role="reject" class="btn-danger px-4 py-2 text-sm">Reject</button>' +
              '<span data-role="meta" class="muted text-xs self-center"></span>' +
              "</div>"
            : d.status === "rejected"
              ? '<button data-role="restore" class="btn-ghost px-4 py-2 text-sm">Restore to pending</button>'
              : "") +
          "</div>"
        );
      }

      function wireDraft(d) {
        const root = document.getElementById("draft-" + d.id);
        if (!root) return;
        const previewEl = root.querySelector('[data-role="preview"]');
        let svgText = null;
        if (d.cardKind) {
          fetchCardSvg(d.cardKind, d.cardData)
            .then((svg) => {
              svgText = svg;
              const blob = new Blob([svg], { type: "image/svg+xml" });
              previewEl.innerHTML = '<img class="rounded-lg border border-[#2a2e37] max-w-full" />';
              previewEl.querySelector("img").src = URL.createObjectURL(blob);
            })
            .catch((e) => (previewEl.innerHTML = '<div class="muted text-xs">Preview failed: ' + escapeHtml(e.message) + "</div>"));
        }
        const meta = root.querySelector('[data-role="meta"]');
        const postBtn = root.querySelector('[data-role="post"]');
        if (postBtn)
          postBtn.addEventListener("click", async () => {
            postBtn.disabled = true;
            meta.textContent = "Posting…";
            try {
              let pngBase64;
              if (d.cardKind) {
                meta.textContent = "Rendering image in browser…";
                if (!svgText) svgText = await fetchCardSvg(d.cardKind, d.cardData);
                pngBase64 = await svgToPngBase64(svgText);
              }
              meta.textContent = "Uploading to X…";
              const res = await fetch("/api/drafts", {
                method: "POST",
                headers: authHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({
                  action: "post",
                  id: d.id,
                  content: root.querySelector('[data-role="content"]').value,
                  pngBase64: pngBase64,
                }),
              });
              const j = await res.json();
              if (!res.ok || j.error) throw new Error(j.error?.message || j.error || "post failed");
              meta.textContent = "Posted! id=" + j.tweetId;
              setTimeout(loadQueue, 800);
            } catch (e) {
              meta.textContent = "Error: " + e.message;
              postBtn.disabled = false;
            }
          });
        const rejectBtn = root.querySelector('[data-role="reject"]');
        if (rejectBtn)
          rejectBtn.addEventListener("click", async () => {
            await fetch("/api/drafts", {
              method: "POST",
              headers: authHeaders({ "Content-Type": "application/json" }),
              body: JSON.stringify({ action: "reject", id: d.id }),
            });
            loadQueue();
          });
        const restoreBtn = root.querySelector('[data-role="restore"]');
        if (restoreBtn)
          restoreBtn.addEventListener("click", async () => {
            await fetch("/api/drafts", {
              method: "POST",
              headers: authHeaders({ "Content-Type": "application/json" }),
              body: JSON.stringify({ action: "restore", id: d.id }),
            });
            loadQueue();
          });
      }

      // ---------- compose ----------
      document.getElementById("compose").addEventListener("click", async () => {
        const meta = document.getElementById("composeMeta");
        let data, cardData;
        try {
          data = JSON.parse(document.getElementById("data").value || "{}");
        } catch {
          meta.textContent = "Tweet data is not valid JSON.";
          return;
        }
        const cardDataRaw = document.getElementById("cardData").value.trim();
        if (cardDataRaw) {
          try {
            cardData = JSON.parse(cardDataRaw);
          } catch {
            meta.textContent = "Card data is not valid JSON.";
            return;
          }
        }
        const cardKind = document.getElementById("cardKind").value;
        meta.textContent = "Generating…";
        try {
          const res = await fetch("/api/drafts", {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              action: "compose",
              kind: document.getElementById("kind").value,
              tone: document.getElementById("tone").value,
              longform: document.getElementById("longform").checked,
              data: data,
              card: cardKind ? { kind: cardKind, data: cardData } : undefined,
            }),
          });
          const j = await res.json();
          if (!res.ok || j.error) throw new Error(j.error?.message || j.error || "compose failed");
          meta.textContent = j.skipped === "queued for approval" ? "Queued — see the approval queue above." : j.skipped || "Queued.";
          queueStatus = "pending";
          loadQueue();
        } catch (e) {
          meta.textContent = "Error: " + e.message;
        }
      });

      // ---------- design studio ----------
      document.querySelectorAll("#cardKinds button").forEach((btn) =>
        btn.addEventListener("click", async () => {
          const box = document.getElementById("studioPreview");
          box.innerHTML = '<div class="muted text-xs">Rendering…</div>';
          try {
            const svg = await fetchCardSvg(btn.dataset.kind, null);
            const blob = new Blob([svg], { type: "image/svg+xml" });
            box.innerHTML = '<img class="rounded-lg border border-[#2a2e37] max-w-full" />';
            box.querySelector("img").src = URL.createObjectURL(blob);
          } catch (e) {
            box.innerHTML = '<div class="muted text-xs">' + escapeHtml(e.message) + " — check the admin key.</div>";
          }
        })
      );

      // ---------- health / fixtures / posts ----------
      async function loadHealth() {
        const el = document.getElementById("health");
        const hints = document.getElementById("healthHints");
        try {
          const res = await fetch("/api/health");
          const h = await res.json();
          const items = Object.entries(h.checks || {}).concat([
            ["x_account_connected", h.xAccountConnected === true],
            ["auto_post", !h.draftMode],
          ]);
          el.innerHTML = items
            .map(([k, ok]) => '<span class="chip px-2.5 py-1">' + (ok === true ? "✓ " : "○ ") + escapeHtml(k.replace(/_/g, " ")) + "</span>")
            .join("");
          hints.innerHTML = (h.hints || []).map((t) => "<li>" + escapeHtml(t) + "</li>").join("");
        } catch (e) {
          el.innerHTML = '<span class="muted">Health check failed</span>';
        }
      }

      async function loadDashboard() {
        try {
          const res = await fetch("/api/dashboard");
          if (!res.ok) throw new Error("dashboard " + res.status);
          const d = await res.json();
          const fx = document.getElementById("fixtures");
          fx.innerHTML =
            (d.upcoming || [])
              .map((f) => {
                const when = new Date(f.date).toLocaleString("en-GB", {
                  timeZone: "Africa/Lagos",
                  weekday: "short",
                  day: "numeric",
                  month: "short",
                  hour: "2-digit",
                  minute: "2-digit",
                });
                const matchup = f.isChelseaHome ? "Chelsea vs " + f.opponent : f.opponent + " vs Chelsea";
                return (
                  '<div class="hairline pt-2"><div class="label">' +
                  escapeHtml(f.competition) +
                  '</div><div class="dim font-semibold">' +
                  escapeHtml(matchup) +
                  '</div><div class="muted text-xs">' +
                  when +
                  " — " +
                  escapeHtml(f.venue || "") +
                  "</div></div>"
                );
              })
              .join("") || '<div class="muted">No upcoming fixtures.</div>';
          const posts = document.getElementById("posts");
          posts.innerHTML =
            (d.recentPosts || [])
              .map(
                (p) =>
                  '<li class="hairline pt-2"><div class="dim">' +
                  escapeHtml(p.content) +
                  '</div><div class="muted text-xs mt-1">' +
                  new Date(p.createdAt).toLocaleString() +
                  "</div></li>"
              )
              .join("") || '<li class="muted">No posts yet.</li>';
        } catch (e) {
          document.getElementById("fixtures").innerHTML = '<div class="muted">' + escapeHtml(e.message) + "</div>";
        }
      }

      function loadAll() {
        loadHealth();
        loadQueue();
        loadDashboard();
      }
      document.getElementById("refresh").addEventListener("click", loadAll);
      loadAll();
    </script>
  </body>
</html>
